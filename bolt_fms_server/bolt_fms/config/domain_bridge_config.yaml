# Name of the domain bridge, used for node naming and logging
name: my_bridge

# to_domain: 0

topics:

# pinky

# task_status topics ----------------------------

  task_status:
    type: std_msgs/msg/String
    from_domain: 31
    to_domain: 0
    remap: robot1/task_status

  task_status:
    type: std_msgs/msg/String
    from_domain: 32
    to_domain: 0
    remap: robot2/task_status

  task_status:
    type: std_msgs/msg/String
    from_domain: 33
    to_domain: 0
    remap: robot3/task_status

  task_status:
    type: std_msgs/msg/String
    from_domain: 34
    to_domain: 0
    remap: robot4/task_status

  task_status:
    type: std_msgs/msg/String
    from_domain: 35
    to_domain: 0
    remap: robot5/task_status

# battery topics --------------------------------
  pinky_battery_present:
    type: std_msgs/msg/Float32
    from_domain: 31
    to_domain: 0
    remap: robot1/battery

  pinky_battery_present:
    type: std_msgs/msg/Float32
    from_domain: 32
    to_domain: 0
    remap: robot2/battery

  pinky_battery_present:
    type: std_msgs/msg/Float32
    from_domain: 33
    to_domain: 0
    remap: robot3/battery

# camera_pose topics ----------------------------
  robot1/camera_pose:
    type: geometry_msgs/msg/PoseStamped
    from_domain: 0
    to_domain: 31
    remap: camera_pose

  robot2/camera_pose:
    type: geometry_msgs/msg/PoseStamped
    from_domain: 0
    to_domain: 32
    remap: camera_pose

  robot3/camera_pose:
    type: geometry_msgs/msg/PoseStamped
    from_domain: 0
    to_domain: 33
    remap: camera_pose


# target_pose pub topics ----------------------------

  robot1/target_pose:
    type: geometry_msgs/msg/PoseStamped
    from_domain: 0
    to_domain: 31
    remap: target_pose

  robot2/target_pose:
    type: geometry_msgs/msg/PoseStamped
    from_domain: 0
    to_domain: 32
    remap: target_pose

  robot3/target_pose:
    type: geometry_msgs/msg/PoseStamped
    from_domain: 0
    to_domain: 33
    remap: target_pose
    
# target_pose sub topics ---------------------------
  target_pose:
    type: geometry_msgs/msg/PoseStamped
    from_domain: 0
    to_domain: 31
    remap: robot1/target_pose

  target_pose:
    type: geometry_msgs/msg/PoseStamped
    from_domain: 0
    to_domain: 32
    remap: robot2/target_pose

  target_pose:
    type: geometry_msgs/msg/PoseStamped
    from_domain: 0
    to_domain: 33
    remap: robot3/target_pose



# 로봇팔
  joint_states:
    type: sensor_msgs/msg/JointState
    from_domain: 34
    to_domain: 0
    remap: robot4/joint_states

  joint_states:
    type: sensor_msgs/msg/JointState
    from_domain: 35
    to_domain: 0
    remap: robot5/joint_states



# Name of the domain bridge, used for node naming and logging
name: my_bridge

from_domain: 0

topics:

# pinky
# battery topics --------------------------------
  pinky_battery_present:
    type: std_msgs/msg/Float32
    from_domain: 151
    to_domain: 0
    remap: robot1/battery

  pinky_battery_present:
    type: std_msgs/msg/Float32
    from_domain: 35
    to_domain: 0
    remap: robot2/battery

  pinky_battery_present:
    type: std_msgs/msg/Float32
    from_domain: 33
    to_domain: 0
    remap: robot3/battery

# camera_pose topics ----------------------------
  robot1/camera_pose:
    type: geometry_msgs/msg/PoseStamped
    from_domain: 0
    to_domain: 151
    remap: camera_pose

  robot2/camera_pose:
    type: geometry_msgs/msg/PoseStamped
    from_domain: 0
    to_domain: 35
    remap: camera_pose

  robot3/camera_pose:
    type: geometry_msgs/msg/PoseStamped
    from_domain: 0
    to_domain: 33
    remap: camera_pose


# target_pose topics ----------------------------

  robot1/target_pose:
    type: geometry_msgs/msg/PoseStamped
    # from_domain: 0
    to_domain: 151
    remap: target_pose

  robot2/target_pose:
    type: geometry_msgs/msg/PoseStamped
    # from_domain: 0
    to_domain: 33
    remap: target_pose

# 로봇팔
  joint_states:
    type: sensor_msgs/msg/JointState
    from_domain: 36
    to_domain: 0
    remap: robot4/joint_states

  joint_states:
    type: sensor_msgs/msg/JointState
    from_domain: 32
    to_domain: 0
    remap: robot5/joint_states